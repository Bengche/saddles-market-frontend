<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="bg-a" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#264E7A"/>
      <stop offset="100%" stop-color="#162840"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg-a)"/>

  <!-- Shield frame -->
  <path d="M50 14 L80 27 L80 50 C80 65 50 74 50 74 C50 74 20 65 20 50 L20 27 Z"
        fill="none" stroke="#C4A862" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Saddle silhouette — front view double-arch seat -->
  <!-- Arch peaks at (38,33) and (62,33), seat dip at (50,44) -->
  <path d="M27 60
           L27 51
           C27 39 30.5 32.5 38.5 32.5
           C45 32.5 48 38.5 50 44
           C52 38.5 55 32.5 61.5 32.5
           C69.5 32.5 73 39 73 51
           L73 60
           Z"
        fill="#C4A862"/>

  <!-- Seat shadow — defines the cradle shape -->
  <path d="M31 59.5 C35 52 42 49 50 49 C58 49 65 52 69 59.5"
        fill="none" stroke="#162840" stroke-width="0.9" opacity="0.45"/>

  <!-- Left stirrup leather -->
  <line x1="31.5" y1="59.5" x2="31.5" y2="66" stroke="#C4A862" stroke-width="1.1"/>
  <!-- Left stirrup iron -->
  <rect x="28.5" y="65.5" width="6" height="4" rx="1.8" fill="none" stroke="#C4A862" stroke-width="1.2"/>

  <!-- Right stirrup leather -->
  <line x1="68.5" y1="59.5" x2="68.5" y2="66" stroke="#C4A862" stroke-width="1.1"/>
  <!-- Right stirrup iron -->
  <rect x="65.5" y="65.5" width="6" height="4" rx="1.8" fill="none" stroke="#C4A862" stroke-width="1.2"/>
</svg>
