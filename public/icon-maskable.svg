<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="bg-m" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#264E7A"/>
      <stop offset="100%" stop-color="#162840"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background — maskable icons must paint edge to edge -->
  <rect width="100" height="100" fill="url(#bg-m)"/>

  <!-- All content within the 80% safe zone (x:10-90, y:10-90) -->

  <!-- Shield frame -->
  <path d="M50 18 L76 29 L76 49 C76 62 50 70 50 70 C50 70 24 62 24 49 L24 29 Z"
        fill="none" stroke="#C4A862" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Saddle silhouette — same double-arch, scaled to fit safe zone -->
  <path d="M30 57
           L30 49
           C30 38.5 33 33 40 33
           C46 33 48.5 38.5 50 43.5
           C51.5 38.5 54 33 60 33
           C67 33 70 38.5 70 49
           L70 57
           Z"
        fill="#C4A862"/>

  <!-- Seat shadow -->
  <path d="M33.5 56.5 C37 50 43 47.5 50 47.5 C57 47.5 63 50 66.5 56.5"
        fill="none" stroke="#162840" stroke-width="0.8" opacity="0.45"/>

  <!-- Left stirrup leather -->
  <line x1="34" y1="56.5" x2="34" y2="62.5" stroke="#C4A862" stroke-width="1"/>
  <!-- Left stirrup iron -->
  <rect x="31" y="62" width="6" height="3.8" rx="1.6" fill="none" stroke="#C4A862" stroke-width="1.1"/>

  <!-- Right stirrup leather -->
  <line x1="66" y1="56.5" x2="66" y2="62.5" stroke="#C4A862" stroke-width="1"/>
  <!-- Right stirrup iron -->
  <rect x="63" y="62" width="6" height="3.8" rx="1.6" fill="none" stroke="#C4A862" stroke-width="1.1"/>
</svg>
